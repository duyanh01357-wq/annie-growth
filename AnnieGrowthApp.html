:root {
  --coral:#E07B5E; --coral-light:#FFF0E6;
  --sage:#8BA888; --sage-light:#E8F0E9;
  --lavender:#B8A9C9; --lavender-light:#F0ECF5;
  --gold:#C9A96E; --gold-light:#F7F1E5;
  --amber:#D4A574; --amber-light:#FDF3E5;
  --brown:#4A3728; --brown-light:#8B7355;
  --muted:#A08C7A; --border:#E8DFD5;
  --bg:#FFFBF5; --white:#FFF;
  --shadow:0 2px 12px rgba(0,0,0,0.04);
  --touch:44px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;
  background:var(--bg);color:var(--brown);
  -webkit-font-smoothing:antialiased;min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom,0);
}
button,input,select,textarea{font-family:inherit;font-size:16px;}
button{border:none;cursor:pointer;transition:all .2s;background:none;min-height:var(--touch);min-width:var(--touch);}
button:hover{opacity:.85}button:active{transform:scale(.97)}
input,select{outline:none;border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--brown);background:var(--white);}

/* ── 导航栏（手机优化：图标更大、间距更大）── */

  background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,0.06);position:sticky;top:0;z-index:100;
  overflow-x:auto;-webkit-overflow-scrolling:touch;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 12px;border-radius:16px;color:var(--brown-light);font-size:11px;font-weight:500;
  min-width:56px;flex-shrink:0;}
.nav-btn.active{background:var(--coral-light);color:var(--coral);font-weight:700;}
.nav-emoji{font-size:22px;line-height:1;}

/* ── 通用布局 ── */
.page{max-width:640px;margin:0 auto;padding:16px 12px 40px;}
.header-center{text-align:center;margin-bottom:20px;}
.header-center h2{font-size:22px;font-weight:800;margin:0 0 4px;}
.header-center .sub{font-size:13px;color:var(--muted);}

.card{background:var(--white);border-radius:20px;padding:16px 16px;box-shadow:var(--shadow);margin-bottom:14px;}
.card-title{font-size:15px;font-weight:600;color:var(--brown);margin-bottom:10px;}

/* ── 今日打卡 ── */
.date-header{text-align:center;margin-bottom:24px;}
.date-header .dow{font-size:13px;color:var(--muted);margin-bottom:2px;letter-spacing:1px;}
.date-header .date{font-size:26px;font-weight:800;margin:0;}
.date-header .tag{margin-top:10px;font-size:14px;color:var(--brown-light);

.mood-row{display:flex;gap:4px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 2px;}
.mood-btn{display:flex;flex-direction:column;align-items:center;gap:1px;

.ach-item{display:flex;align-items:flex-start;gap:12px;background:white;

.ach-item .ach-icon{width:var(--touch);height:var(--touch);border-radius:50%;

.ach-item .ach-desc{font-size:14px;font-weight:600;margin-bottom:2px;}
.ach-item .ach-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  background:var(--lavender-light);color:#8B7BA8;}

/* ── 每周报告 ── */
.stat-cards{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.stat-cards .sc{flex:1 1 130px;border-radius:20px;padding:18px 16px;text-align:center;}
.stat-cards .sc .val{font-size:30px;font-weight:800;}
.stat-cards .sc .lbl{font-size:13px;}
.bar-row{display:flex;gap:5px;align-items:flex-end;height:70px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.bar-col .bar{width:100%;border-radius:8px 8px 0 0;min-height:4px;transition:height .5s;}
.bar-col .label{font-size:10px;color:var(--muted);}
.hl-item{display:flex;align-items:center;gap:10px;padding:10px 14px;

.msg-box{text-align:center;padding:24px 20px;border-radius:20px;margin-top:18px;}
.msg-box .msg-title{font-size:20px;font-weight:700;margin-bottom:6px;}
.msg-box .msg-body{font-size:14px;color:var(--brown-light);line-height:1.6;}

/* ── 健康记录 ── */
.health-form{display:flex;flex-direction:column;gap:10px;}
.health-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.health-row label{font-size:13px;color:var(--muted);min-width:50px;flex-shrink:0;}
.health-row input,.health-row select{flex:1;min-width:80px;min-height:var(--touch);font-size:14px;}
.health-row .unit{font-size:12px;color:var(--muted);flex-shrink:0;}
.health-chart{margin-top:16px;background:var(--white);border-radius:20px;
  padding:16px;box-shadow:var(--shadow);}
.health-chart .chart-title{font-size:14px;font-weight:600;color:var(--brown);margin-bottom:10px;}
.health-list{margin-top:10px;}
.health-list-item{display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:#FFFBF5;border-radius:12px;margin-bottom:6px;font-size:13px;}
.health-list-item .hl-date{color:var(--muted);flex-shrink:0;font-size:12px;}
.health-list-item .hl-info{flex:1;color:var(--brown);}
.health-list-item .hl-del{color:#D4A0A0;font-size:14px;cursor:pointer;padding:4px 8px;}

/* ── 页脚 ── */
.footer{text-align:center;padding:28px 16px 40px;font-size:11px;color:#C4B5A5;}

/* ── 动画 ── */
@keyframes popIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes particleFloat{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-200px) scale(.2);opacity:0}}

<body>
<div id="app"></div>
<!-- 语音状态提示 -->
<div id="voiceToast" class="voice-toast">🎤 正在听...</div>
<!-- 保存提示 -->
<div id="saveToast" class="voice-toast">✅ 已保存</div>

<script>
/* ═══════════════════════════════════════════════════════════
   Annie 成长合伙人 v3 — 纯原生 JS · 自动备份
   ═══════════════════════════════════════════════════════════ */

const STORAGE_KEY = 'annie_growth_data_v2';
const STORAGE_BACKUP_KEY = 'annie_growth_data_v2_backup';

const DIMENSIONS = [
  { key:'learning', label:'学习进步', icon:'📚', color:'#E07B5E', gradient:'linear-gradient(135deg,#FDE8E0,#FCE4D6)', hint:'今天学到了什么新东西？' },
  { key:'interest', label:'兴趣发展', icon:'🎨', color:'#8BA888', gradient:'linear-gradient(135deg,#E8F0E9,#DFEDE2)', hint:'画画、书法、游泳有进步吗？' },
  { key:'social', label:'社交成长', icon:'🤝', color:'#B8A9C9', gradient:'linear-gradient(135deg,#F0ECF5,#EBE4F2)', hint:'今天和朋友相处得怎么样？' },
  { key:'life', label:'生活技能', icon:'🌱', color:'#C9A96E', gradient:'linear-gradient(135deg,#F7F1E5,#F3EBD8)', hint:'自己做了什么力所能及的事？' },
  { key:'character', label:'品格发展', icon:'⭐', color:'#D4A574', gradient:'linear-gradient(135deg,#FDF3E5,#FBEBD5)', hint:'今天坚持了什么？诚实了吗？' },
];

const MOODS = [
  { key:'great', emoji:'😄', label:'超开心' },{ key:'good', emoji:'🙂', label:'还不错' },
  { key:'ok', emoji:'😐', label:'一般般' },{ key:'down', emoji:'😔', label:'有点低落' },{ key:'sad', emoji:'😢', label:'不开心' },
];

const TYPE_LABELS = { progress:'进步时刻', brave_try:'勇气尝试', milestone:'特别里程碑', all_checked:'全勤打卡' };
const TYPE_ICONS = { progress:'⭐', brave_try:'🦋', milestone:'💝', all_checked:'🌟' };

// ── 工具函数 ──
const today = () => new Date().toISOString().slice(0,10);
const weekKey = d => { const dt=new Date(d); const day=dt.getDay(); dt.setDate(dt.getDate()-day+(day===0?-6:1)); return dt.toISOString().slice(0,10); };
const formatDate = d => { const dt=new Date(d); return dt.getFullYear()+'年'+(dt.getMonth()+1)+'月'+dt.getDate()+'日'; };
const dayName = d => ['日','一','二','三','四','五','六'][new Date(d).getDay()];

function loadData() {
  // 尝试主 key
  let r = null;
  try { r = localStorage.getItem(STORAGE_KEY); } catch(e) {}
  if (r) {
    try {
      const d = JSON.parse(r);
      if (!d.healthRecords) d.healthRecords = [];
      if (!d.id) d.id = Date.now().toString(36);
      console.log('[Annie] 数据已加载：' + Object.keys(d.days||{}).length + ' 天记录，' + (d.achievements||[]).length + ' 条成就');
      return d;
    } catch(e) {
      console.warn('[Annie] 主存储数据损坏，尝试从备份恢复…');
    }
  }
  // 尝试备份恢复
  let br = null;
  try { br = localStorage.getItem(STORAGE_BACKUP_KEY); } catch(e) {}
  if (br) {
    try {
      const d = JSON.parse(br);
      if (!d.healthRecords) d.healthRecords = [];
      if (!d.id) d.id = Date.now().toString(36);
      console.warn('[Annie] 已从备份恢复数据：' + Object.keys(d.days||{}).length + ' 天记录');
      try { localStorage.setItem(STORAGE_KEY, br); } catch(e) {}
      return d;
    } catch(e) {
      console.error('[Annie] 备份数据也损坏了，无法恢复');
    }
  }
  if (r) {
    console.error('[Annie] 数据解析失败。请导出备份后重新导入。');
  }
  return { days:{}, achievements:[], health:{}, healthRecords:[], id:Date.now().toString(36) };
}
function saveData() {
  const json = JSON.stringify(data);
  try {
    localStorage.setItem(STORAGE_KEY, json);
    localStorage.setItem(STORAGE_BACKUP_KEY, json);
  } catch(e) {
    alert('存储空间不足！请先导出备份，然后清理浏览器数据。');
  }
}

let data = loadData();
let view = 'daily';
let viewDate = today();  // 打卡页当前查看的日期
let celebrationTimer = null;
let saveToastTimer = null;
let recognition = null;
let currentMicTarget = null;

// ── 保存提示 Toast ──
function saveToast() {
  const toast = $('#saveToast');
  if (!toast) return;
  toast.classList.add('show');
  if (saveToastTimer) clearTimeout(saveToastTimer);
  saveToastTimer = setTimeout(() => toast.classList.remove('show'), 1200);
}

// ── 自动保存（输入框 blur 时调用）──
function autoSave() { saveData(); saveToast(); }

// ── DOM 工具 ──
const $ = s => document.querySelector(s);
const h = (tag, attrs, ...children) => {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'class') el.className = v;
    else if (k === 'htmlFor') el.setAttribute('for', v);
    else el.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (typeof c === 'string') el.appendChild(document.createTextNode(c));
    else if (c instanceof Node) el.appendChild(c);
  });
  return el;
};

// ── 语音识别 ──
function initSpeech() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return false;
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript.trim();
    if (currentMicTarget && text) {
      currentMicTarget.value = text;
      currentMicTarget.dispatchEvent(new Event('input', { bubbles: true }));
      // 触发自定义事件给父组件
      if (currentMicTarget._onInput) currentMicTarget._onInput(text);
    }
    hideVoiceToast();
    currentMicTarget = null;
  };

  recognition.onerror = () => {
    hideVoiceToast();
    currentMicTarget = null;
  };

  recognition.onend = () => {
    hideVoiceToast();
    currentMicTarget = null;
  };

  return true;
}

function startListening(targetInput) {
  if (!recognition) {
    alert('抱歉，您的浏览器不支持语音输入。请使用 Chrome 或 Safari 浏览器。');
    return;
  }
  try { recognition.abort(); } catch(e) {}
  currentMicTarget = targetInput;
  showVoiceToast();
  try { recognition.start(); } catch(e) { hideVoiceToast(); currentMicTarget = null; }
}

function showVoiceToast() {
  const toast = $('#voiceToast');
  if (toast) { toast.classList.add('show'); }
}
function hideVoiceToast() {
  const toast = $('#voiceToast');
  if (toast) { toast.classList.remove('show'); }
}

// ── 创建麦克风按钮 ──
function createMicBtn(targetInput) {
  const btn = h('button', {
    class:'mic-btn',
    onClick:(e) => { e.preventDefault(); e.stopPropagation(); startListening(targetInput); },
    title:'语音输入'
  }, '🎤');
  return btn;
}

// ── 庆祝动画 ──
function showCelebration() {
  if (celebrationTimer) clearTimeout(celebrationTimer);
  const overlay = h('div', { class:'overlay' });
  const colors = ['#E07B5E','#8BA888','#B8A9C9','#F4C542','#F08A7D','#7EB5A6'];
  for (let i=0;i<40;i++) {
    overlay.appendChild(h('div', { style:{
      position:'absolute',left:(Math.random()*100)+'%',top:'40%',
      width:(6+Math.random()*10)+'px',height:(6+Math.random()*10)+'px',
      background:colors[Math.floor(Math.random()*colors.length)],
      borderRadius:Math.random()>.5?'50%':'2px',
      animation:'particleFloat '+(1.2+Math.random()*1.5)+'s '+Math.random()*.8+'s ease-out forwards'

// ═══════════════════════════════════════════════════════════
// 每日打卡
// ═══════════════════════════════════════════════════════════
function renderDaily() {
  const dateKey = viewDate;
  const isToday = (dateKey === today());
  if (!data.days[dateKey]) data.days[dateKey] = {};
  const dayData = data.days[dateKey];
  const allChecked = DIMENSIONS.every(d => dayData[d.key]?.progress);
  const totalDays = Object.keys(data.days).length;
  const main = $('#main'); main.innerHTML = '';

  const page = h('div',{class:'page'});

  // ── 日期导航 ──
  const prevDate = (() => { const d = new Date(dateKey); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); })();
  const nextDate = (() => { const d = new Date(dateKey); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); })();
  const nextDisabled = (nextDate > today());

  const nav = h('div', { style: 'display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;' });
  nav.appendChild(h('button', {
    onClick: () => { viewDate = prevDate; renderDaily(); },
    style: 'width:36px;height:36px;border-radius:50%;border:1.5px solid #E8DFD5;font-size:16px;display:flex;align-items:center;justify-content:center;color:#8B7355;'
  }, '◀'));
  nav.appendChild(h('div', {
    style: 'font-size:15px;font-weight:700;color:'+(isToday?'var(--coral)':'var(--brown)')+';min-width:100px;text-align:center;'
  }, isToday ? '📅 今天' : formatDate(dateKey)));
  nav.appendChild(h('button', {
    onClick: () => { if (!nextDisabled) { viewDate = nextDate; renderDaily(); } },
    style: 'width:36px;height:36px;border-radius:50%;border:1.5px solid '+(nextDisabled?'#E8DFD5':'#E8DFD5')+';font-size:16px;display:flex;align-items:center;justify-content:center;color:'+(nextDisabled?'#D4C5B2':'#8B7355')+';',
    disabled: nextDisabled
  }, '▶'));
  page.appendChild(nav);

  // 如果不在今天，显示回到今天按钮
  if (!isToday) {
    nav.appendChild(h('button', {
      onClick: () => { viewDate = today(); renderDaily(); },
      style: 'padding:6px 14px;border-radius:50px;background:var(--coral-light);color:var(--coral);font-size:12px;font-weight:600;'
    }, '回今天'));
  }

  // 已记录天数提示
  page.appendChild(h('div', { style: 'text-align:center;margin-bottom:16px;font-size:12px;color:var(--muted);' },
    '📋 已记录 ' + totalDays + ' 天 · 数据自动保存，无需手动操作'
  ));

  // 状态标签
  page.appendChild(h('div',{style:'text-align:center;margin-bottom:20px;'},
    h('div',{class:'tag'},allChecked?'🎉 '+(isToday?'今天的你已经很棒了！':'这一天全部完成！'):(isToday?'今天有什么进步呢？':'回顾这一天…'))
  ));

  // 心情
  const moodCard = h('div',{class:'card'},
    h('div',{class:'card-title'},'今天心情怎么样？'),
    h('div',{class:'mood-row'})
  );
  const curMood = (data.health&&data.health[dateKey])?data.health[dateKey].mood:null;
  MOODS.forEach(m => {
    moodCard.querySelector('.mood-row').appendChild(h('button',{
      class:'mood-btn'+(curMood===m.key?' sel':''),
      onClick:()=>{
        if(!data.health)data.health={}; if(!data.health[dateKey])data.health[dateKey]={};
        data.health[dateKey].mood=m.key; saveData(); saveToast(); renderDaily();
      }
    }, h('span',{class:'emoji'},m.emoji), h('span',{},m.label)));
  });
  page.appendChild(moodCard);

  // 维度打卡
  DIMENSIONS.forEach(dim => {
    const dd = dayData[dim.key] || {};
    const hasProgress = dd.progress || false;
    const note = dd.note || '';

    const card = h('div',{
      class:'dim-card'+(hasProgress?' done':''),
      style:{ background:hasProgress?dim.gradient:'#F8F5F0', borderColor:hasProgress?dim.color+'30':'transparent' }
    });

    // 标题行（无按钮，输入文字即表示进步）
    card.appendChild(h('div',{class:'dim-row'},
      h('div',{class:'dim-info'},
        h('span',{class:'dim-icon'},dim.icon),
        h('div',{}, h('div',{class:'dim-name'},dim.label), h('div',{class:'dim-hint'},dim.hint))
      )
    ));

    // 备注 + 语音输入（输入文字即自动标记完成，清空则取消）
    const noteRow = h('div',{class:'note-row'});
    const input = h('input',{ type:'text', value:note, placeholder:'记下具体进步了什么...' });

    const markProgress = (text) => {
      if (!data.days[dateKey][dim.key]) data.days[dateKey][dim.key] = {};
      const wasProgress = data.days[dateKey][dim.key].progress;
      data.days[dateKey][dim.key].note = text;
      data.days[dateKey][dim.key].date = dateKey;
      const hasText = text && text.trim().length > 0;
      data.days[dateKey][dim.key].progress = hasText;
      saveData();
      // 如果之前未完成，现在完成了（有文字），检查是否五项全满
      if (!wasProgress && hasText) {
        const nowAll = DIMENSIONS.every(d => {
          if (d.key === dim.key) return true;
          return (data.days[dateKey][d.key] || {}).progress;
        });
        if (nowAll) {
          const exists = (data.achievements || []).some(a => a.date === dateKey && a.type === 'all_checked');
          if (!exists) {
            if (!data.achievements) data.achievements = [];
            data.achievements.push({ date: dateKey, type: 'all_checked', description: '完成了' + formatDate(dateKey) + '的全部五项打卡！', icon: '🌟' });
            saveData();
          }
          showCelebration();
        }
      }
    };

    input.addEventListener('input', (e) => { markProgress(e.target.value); });
    input.addEventListener('blur', () => { saveData(); saveToast(); });
    input._onInput = (text) => { markProgress(text); };
    noteRow.appendChild(input);
    noteRow.appendChild(createMicBtn(input));
    card.appendChild(noteRow);
    page.appendChild(card);
  });

  if(allChecked){
    page.appendChild(h('div',{style:'margin-top:20px;text-align:center;padding:20px;border-radius:20px;background:linear-gradient(135deg,#F5F2F8,#FFF0E6)'},
      h('div',{style:'font-size:17px;font-weight:700;color:#4A3728;margin-bottom:4px'},'今天的五项打卡全部完成！'),
      h('div',{style:'font-size:14px;color:#8B7355'},'记得去「花园」看看今天种下的种子 🌱')
    ));
  }

  // ── 保存按钮 ──
  page.appendChild(h('div', { style: 'margin-top:16px;' },
    h('button', {
      style: 'width:100%;padding:14px 0;border-radius:16px;background:linear-gradient(135deg,#8BA888,#7A9A78);color:white;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 4px 16px rgba(139,168,136,0.3);',
      onClick: () => {
        saveData();
        const toast = $('#saveToast');
        toast.textContent = '✅ 保存成功！';
        toast.classList.add('show');
        if (saveToastTimer) clearTimeout(saveToastTimer);
        saveToastTimer = setTimeout(() => { toast.textContent = '✅ 已保存'; toast.classList.remove('show'); }, 2000);
      }
    }, '💾 保  存')
  ));

  main.appendChild(page);
}

// 花园
// ═══════════════════════════════════════════════════════════
function renderGarden() {
  const main = $('#main'); main.innerHTML = '';
  const sortedDays = Object.keys(data.days||{}).sort((a,b)=>b.localeCompare(a));
  const recentDays = sortedDays.slice(0,42);
  const getStage = dd => { if(!dd)return 0; return DIMENSIONS.filter(d=>dd[d.key]?.progress).length; };
  const totalFlowers = recentDays.reduce((s,d)=>s+getStage(data.days[d]),0);
  let streak=0;
  for(let i=0;i<365;i++){ const d=new Date(today());d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);const dd=data.days[k];if(dd&&DIMENSIONS.some(dim=>(dd[dim.key]||{}).progress))streak++;else if(i>0)break; }

  const page = h('div',{class:'page'});
  page.appendChild(h('div',{class:'header-center'},h('h2',{},'🌸 Annie 的成长花园')));

  const stats = h('div',{class:'stats-row'});
  [{v:totalFlowers,l:'总花朵数',c:'#E07B5E'},{v:streak,l:'连续打卡',c:'#8BA888'},{v:recentDays.length,l:'记录天数',c:'#B8A9C9'}].forEach(s=>{
    stats.appendChild(h('div',{class:'stat-card'},h('div',{class:'val',style:'color:'+s.c},''+s.v),h('div',{class:'lbl'},s.l)));
  });
  page.appendChild(stats);

  const gardenBox = h('div',{class:'garden-box'});
  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');svg.setAttribute('viewBox','0 0 560 320');svg.style.width='100%';svg.style.height='auto';
  const addSvg=(tag,attrs)=>{const e=document.createElementNS(svgNS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));svg.appendChild(e);return e;};
  addSvg('ellipse',{cx:'280',cy:'290',rx:'260',ry:'30',fill:'#E8E0D0',opacity:'0.5'});
  addSvg('rect',{x:'0',y:'280',width:'560',height:'40',fill:'#F0EDE4',opacity:'0.3'});

  const flowerColors=['#E07B5E','#8BA888','#B8A9C9','#C9A96E','#D4A574'];
  recentDays.slice(0,21).forEach((day,i)=>{
    const row=Math.floor(i/7),col=i%7,x=60+col*72,y=50+row*110,stage=getStage(data.days[day]),sz=36;
    if(stage===0){
      addSvg('circle',{cx:x,cy:y+sz*.7,r:sz*.18,fill:'#E8DFD5',opacity:'0.5'});
      const t=addSvg('text',{x:x,y:y+sz*.75,'text-anchor':'middle','font-size':sz*.22,fill:'#C4B5A5'}); t.textContent='🌰';
    }else{
      addSvg('line',{x1:x,y1:y+sz*.6,x2:x,y2:y+sz*.7,stroke:'#8BA888','stroke-width':'1.5',opacity:'0.6'});
      for(let p=0;p<stage;p++){const a=(p/stage)*Math.PI*2-Math.PI/2;addSvg('circle',{cx:x+Math.cos(a)*sz*.25,cy:y+Math.sin(a)*sz*.25,r:sz*.12,fill:flowerColors[stage-1],opacity:'0.8'});}
      addSvg('circle',{cx:x,cy:y,r:sz*.1,fill:'#F4C542'});
      if(stage>=3){
        addSvg('ellipse',{cx:x+sz*.18,cy:y+sz*.55,rx:sz*.13,ry:sz*.07,fill:'#8BA888',opacity:'0.5',transform:'rotate(-30 '+(x+sz*.18)+' '+(y+sz*.55)+')'});
        addSvg('ellipse',{cx:x-sz*.18,cy:y+sz*.45,rx:sz*.13,ry:sz*.07,fill:'#8BA888',opacity:'0.5',transform:'rotate(30 '+(x-sz*.18)+' '+(y+sz*.45)+')'});
      }
    }
    const dt=addSvg('text',{x:x,y:y+sz*.9,'text-anchor':'middle','font-size':sz*.2,fill:'#A08C7A'});dt.textContent=day.slice(5);
  });
  gardenBox.appendChild(svg);page.appendChild(gardenBox);

  if(recentDays.length===0)page.appendChild(h('div',{class:'empty-state'},h('div',{class:'icon'},'🌱'),'花园还是空的呢',h('br'),'快去「打卡」种下第一颗种子吧！'));
  if(streak>=7)page.appendChild(h('div',{class:'encourage',style:'background:linear-gradient(135deg,#E8F0E9,#F0ECF5)'},h('div',{style:'font-size:16px;font-weight:600'},'🎉 连续打卡 '+streak+' 天！'),h('div',{style:'font-size:13px;color:#6B8B6E;margin-top:4px'},'每一天的努力都让花园更美丽')));
  main.appendChild(page);
}

    ));

      onClick: () => {

  ));

  main.appendChild(page);

  function addAch(){const d=achInput.value.trim();if(!d)return null;if(!data.achievements)data.achievements=[];const item={date:today(),type:achType,description:d,icon:achType==='brave_try'?'🦋':achType==='progress'?'⭐':'💝'};data.achievements.push(item);achInput.value='';return item;}

    renderAchievements();

  }
}

  days.forEach(day=>{bc.querySelector('.bar-row').appendChild(h('div',{class:'bar-col'},h('div',{class:'bar',style:'height:'+(day.checked>0?(day.checked/5)*60:4)+'px;background:'+(day.checked>0?'linear-gradient(180deg,#E07B5E,#F4A88A)':'#E8DFD5')}),h('div',{class:'label'},day.label)));});
  page.appendChild(bc);

  if(hls.length>0){const hlc=h('div',{class:'card'},h('div',{class:'card-title'},'✨ 本周亮点'));hls.forEach(hl=>{hlc.appendChild(h('div',{class:'hl-item'},h('span',{class:'hl-icon'},hl.icon),h('div',{},h('div',{class:'hl-note'},hl.note),h('div',{class:'hl-meta'},hl.dim+' · '+formatDate(hl.date)))));});page.appendChild(hlc);}

  page.appendChild(h('div',{class:'msg-box',style:'background:linear-gradient(135deg,#FDF3E5,#F0ECF5)'},h('div',{class:'msg-title'},mt),h('div',{class:'msg-body'},mb)));
  main.appendChild(page);
}

// ═══════════════════════════════════════════════════════════
// 健康记录（新增）
// ═══════════════════════════════════════════════════════════
function renderHealth(){
  const main=$('#main');main.innerHTML='';
  const page=h('div',{class:'page'});
  page.appendChild(h('div',{class:'header-center'},h('h2',{},'💪 健康记录'),h('div',{class:'sub'},'记录身高体重和身体状况')));

  // 添加记录表单
  const formCard=h('div',{class:'card'},h('div',{class:'card-title'},'记录今天的健康数据'));
  const form=h('div',{class:'health-form'});

  const fields=[
    {id:'h_date',label:'日期',type:'date',def:today()},
    {id:'h_height',label:'身高',type:'number',unit:'cm',placeholder:'如 140',step:'0.1'},
    {id:'h_weight',label:'体重',type:'number',unit:'kg',placeholder:'如 35',step:'0.1'},
    {id:'h_vision_l',label:'左眼视力',type:'text',placeholder:'如 5.0'},
    {id:'h_vision_r',label:'右眼视力',type:'text',placeholder:'如 5.0'},
    {id:'h_sleep_wake',label:'起床',type:'time'},
    {id:'h_sleep_bed',label:'就寝',type:'time'},
    {id:'h_exercise',label:'运动',type:'text',placeholder:'类型+时长，如 游泳60分钟'},
    {id:'h_screen',label:'屏幕时间',type:'number',unit:'分钟',step:'1'},
    {id:'h_note',label:'备注',type:'text',placeholder:'感冒、过敏、情绪等'},
  ];

  const formData={};
  fields.forEach(f=>{
    const row=h('div',{class:'health-row'});
    row.appendChild(h('label',{htmlFor:f.id},f.label));
    const inp=h('input',{type:f.type,id:f.id,placeholder:f.placeholder||'',step:f.step||''});
    if(f.def)inp.value=f.def;
    // 自动保存：blur 时触发
    inp.addEventListener('blur', () => saveHealthRecord());
    inp.addEventListener('change', () => saveHealthRecord());
    row.appendChild(inp);
    if(f.unit)row.appendChild(h('span',{class:'unit'},f.unit));
    form.appendChild(row);
    formData[f.id]=inp;
  });

  function saveHealthRecord() {
    if(!data.healthRecords)data.healthRecords=[];
    const rec={date:formData.h_date.value||today()};
    const hh=parseFloat(formData.h_height.value);if(!isNaN(hh))rec.height=hh;
    const hw=parseFloat(formData.h_weight.value);if(!isNaN(hw))rec.weight=hw;
    if(formData.h_vision_l.value)rec.visionL=formData.h_vision_l.value;
    if(formData.h_vision_r.value)rec.visionR=formData.h_vision_r.value;
    if(formData.h_sleep_bed.value)rec.sleepBed=formData.h_sleep_bed.value;
    if(formData.h_sleep_wake.value)rec.sleepWake=formData.h_sleep_wake.value;
    if(formData.h_exercise.value)rec.exercise=formData.h_exercise.value;
    const sc=parseInt(formData.h_screen.value);if(!isNaN(sc))rec.screenTime=sc;
    if(formData.h_note.value)rec.note=formData.h_note.value;
    const idx=data.healthRecords.findIndex(r=>r.date===rec.date);
    if(idx>=0)data.healthRecords[idx]=rec;else data.healthRecords.push(rec);
    data.healthRecords.sort((a,b)=>b.date.localeCompare(a.date));
    saveData(); saveToast();
  }

  // 日期切换时也自动保存
  formData.h_date.addEventListener('change', () => {
    saveHealthRecord();
    // 切日期后重新加载该日期的数据
    const d = formData.h_date.value;
    const existing = (data.healthRecords||[]).find(r => r.date === d);
    if (existing) {
      if (existing.height) formData.h_height.value = existing.height;
      else formData.h_height.value = '';
      if (existing.weight) formData.h_weight.value = existing.weight;
      else formData.h_weight.value = '';
      formData.h_vision_l.value = existing.visionL || '';
      formData.h_vision_r.value = existing.visionR || '';
      formData.h_sleep_bed.value = existing.sleepBed || '';
      formData.h_sleep_wake.value = existing.sleepWake || '';
      formData.h_exercise.value = existing.exercise || '';
      formData.h_screen.value = existing.screenTime !== undefined ? existing.screenTime : '';
      formData.h_note.value = existing.note || '';
    } else {
      ['h_height','h_weight','h_vision_l','h_vision_r','h_sleep_bed','h_sleep_wake','h_exercise','h_screen','h_note'].forEach(id => {
        formData[id].value = '';
      });
    }
  });

  formCard.appendChild(form);page.appendChild(formCard);

  // 身高体重趋势图
  const records=(data.healthRecords||[]).slice().reverse();
  const hRecs=records.filter(r=>r.height||r.weight);
  if(hRecs.length>=2){
    const chartCard=h('div',{class:'health-chart'},h('div',{class:'chart-title'},'📈 身高体重趋势'));
    const csvg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    csvg.setAttribute('viewBox','0 0 560 200');csvg.style.width='100%';csvg.style.height='200px';
    const cadd=(tag,attrs)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));csvg.appendChild(e);return e;};

    const mx=60,my=20,gw=480,gh=150;
    cadd('line',{x1:mx,y1:my+gh,x2:mx+gw,y2:my+gh,stroke:'#E8DFD5','stroke-width':'1'});
    cadd('line',{x1:mx,y1:my,x2:mx,y2:my+gh,stroke:'#E8DFD5','stroke-width':'1'});

    const heights=hRecs.filter(r=>r.height).map(r=>r.height);
    const weights=hRecs.filter(r=>r.weight).map(r=>r.weight);
    const hMin=Math.floor(Math.min(...heights)-2),hMax=Math.ceil(Math.max(...heights)+2);
    const wMin=Math.floor(Math.min(...weights)-2),wMax=Math.ceil(Math.max(...weights)+2);

    const plot=(vals,min,max,color)=>{
      if(vals.length<2)return;
      const pts=vals.map((v,i)=>(mx+(i/(hRecs.length-1))*gw)+','+(my+gh-((v-min)/(max-min))*gh)).join(' ');
      cadd('polyline',{points:pts,fill:'none',stroke:color,'stroke-width':'2.5','stroke-linejoin':'round'});
      vals.forEach((v,i)=>{cadd('circle',{cx:mx+(i/(hRecs.length-1))*gw,cy:my+gh-((v-min)/(max-min))*gh,r:'4',fill:color});});
    };

    const hVals=hRecs.map(r=>r.height||null).filter(v=>v!==null);
    const wVals=hRecs.map(r=>r.weight||null).filter(v=>v!==null);
    if(hVals.length>=2)plot(hVals,hMin,hMax,'#E07B5E');
    if(wVals.length>=2)plot(wVals,wMin,wMax,'#8BA888');

    // 日期标签
    const labelDates=[hRecs[0],hRecs[Math.floor((hRecs.length-1)/2)],hRecs[hRecs.length-1]];
    [0,Math.floor((hRecs.length-1)/2),hRecs.length-1].forEach((idx,i)=>{
      const t=cadd('text',{x:mx+(idx/(hRecs.length-1))*gw,y:my+gh+16,'text-anchor':i===0?'start':i===2?'end':'middle',fill:'#A08C7A','font-size':'10','font-family':'PingFang SC,sans-serif'});
      t.textContent=hRecs[idx]?.date?.slice(5)||'';
    });

    // 图例
    cadd('text',{x:mx+gw-60,y:my+10,fill:'#E07B5E','font-size':'10','font-family':'PingFang SC,sans-serif'}).textContent='身高';
    cadd('text',{x:mx+gw-30,y:my+10,fill:'#8BA888','font-size':'10','font-family':'PingFang SC,sans-serif'}).textContent='体重';

    chartCard.appendChild(csvg);page.appendChild(chartCard);
  }

  // 历史记录列表
  if(records.length>0){
    const listCard=h('div',{class:'card'},h('div',{class:'card-title'},'📋 历史记录（最新在前）'));
    const list=h('div',{class:'health-list'});
    records.slice(0,20).forEach(r=>{
      const parts=[];
      if(r.height)parts.push('身高 '+r.height+'cm');
      if(r.weight)parts.push('体重 '+r.weight+'kg');
      if(r.visionL||r.visionR)parts.push('视力 '+(r.visionL||'?')+'/'+(r.visionR||'?'));
      if(r.sleepBed&&r.sleepWake)parts.push('睡眠 '+r.sleepBed+'-'+r.sleepWake);
      if(r.exercise)parts.push('运动:'+r.exercise);
      if(r.screenTime!==undefined)parts.push('屏幕 '+r.screenTime+'分钟');
      if(r.note)parts.push('备注:'+r.note);

      list.appendChild(h('div',{class:'health-list-item'},
        h('span',{class:'hl-date'},r.date),
        h('span',{class:'hl-info'},parts.join(' | ')||'无数据'),
        h('span',{class:'hl-del',onClick:()=>{
          if(confirm('删除 '+r.date+' 的记录？')){
            data.healthRecords=data.healthRecords.filter(x=>x.date!==r.date);
            saveData();renderHealth();
          }
        }},'✕')
      ));
    });
    listCard.appendChild(list);page.appendChild(listCard);
  }

  // 参考值
  page.appendChild(h('div',{style:'margin-top:16px;padding:12px 16px;background:var(--white);border-radius:16px;font-size:11px;color:var(--muted);line-height:1.6;box-shadow:var(--shadow)'},
    '📌 参考（来源：AAP 2024）：10岁女孩身高约 130-150cm，体重约 27-42kg。每个孩子发育节奏不同，仅作参考。建议睡眠 9-11小时/天，户外活动 ≥ 60分钟/天。'
  ));

  // ── 保存按钮 ──
  page.appendChild(h('div', { style: 'margin-top:16px;' },
    h('button', {
      style: 'width:100%;padding:14px 0;border-radius:16px;background:linear-gradient(135deg,#8BA888,#7A9A78);color:white;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 4px 16px rgba(139,168,136,0.3);',
      onClick: () => {
        saveHealthRecord();
        saveData();
        const toast = $('#saveToast');
        toast.textContent = '✅ 保存成功！';
        toast.classList.add('show');
        if (saveToastTimer) clearTimeout(saveToastTimer);
        saveToastTimer = setTimeout(() => { toast.textContent = '✅ 已保存'; toast.classList.remove('show'); }, 2000);
      }
    }, '💾 保  存')
  ));

  main.appendChild(page);
}

// ═══════════════════════════════════════════════════════════
// 底部：数据说明 + 导出导入
// ═══════════════════════════════════════════════════════════
function renderFooter() {
  const footer = $('#appFooter');
  if (!footer) return;
  footer.innerHTML = '';

  const container = h('div', { style: 'max-width:640px;margin:0 auto;padding:0 12px;' });

  // 导出按钮行
  const btnRow = h('div', { style: 'display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;' });

  btnRow.appendChild(h('button', {
    style: 'padding:10px 20px;border-radius:50px;background:var(--sage);color:white;font-size:13px;font-weight:600;',
    onClick: () => {
      const exportData = {
        version: 2,
        exportedAt: new Date().toISOString(),
        child: 'Annie',
        data: data
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = h('a', { href: url, download: 'Annie成长数据备份_' + today() + '.json', style: 'display:none' });
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      const toast = $('#saveToast');
      toast.textContent = '📥 备份文件已下载';
      toast.classList.add('show');
      if (saveToastTimer) clearTimeout(saveToastTimer);
      saveToastTimer = setTimeout(() => { toast.textContent = '✅ 已保存'; toast.classList.remove('show'); }, 2000);
    }
  }, '📥 导出数据备份'));

  btnRow.appendChild(h('button', {
    style: 'padding:10px 20px;border-radius:50px;background:var(--lavender);color:white;font-size:13px;font-weight:600;',
    onClick: () => {
      const inp = h('input', { type: 'file', accept: '.json', style: 'display:none',
        onChange: (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const imported = JSON.parse(reader.result);
              if (!imported.data) { alert('文件格式不正确，请选择 Annie 成长数据备份文件'); return; }
              if (confirm('导入将覆盖当前所有数据，确定继续吗？')) {
                data = { ...imported.data };
                if (!data.healthRecords) data.healthRecords = [];
                saveData();
                const toast = $('#saveToast');
                toast.textContent = '📤 数据已导入';
                toast.classList.add('show');
                if (saveToastTimer) clearTimeout(saveToastTimer);
                saveToastTimer = setTimeout(() => { toast.textContent = '✅ 已保存'; toast.classList.remove('show'); }, 2000);
                render();
              }
            } catch(err) { alert('文件解析失败，请检查文件是否完整'); }
          };
          reader.readAsText(file);
        }
      });
      document.body.appendChild(inp);
      inp.click();
      inp.remove();
    }
  }, '📤 导入备份'));

  container.appendChild(btnRow);

  // 说明文字
  const info = h('div', { style: 'text-align:center;font-size:11px;color:#C4B5A5;line-height:1.8;' });
  const dayCount = Object.keys(data.days||{}).length;
  info.innerHTML = ''
    + '<div style="margin-bottom:4px;">💡 <b>数据说明</b></div>'
    + '所有数据保存在<b>浏览器本地存储</b>中，不上传任何服务器。<br>'
    + '每个设备独立存储（手机和电脑数据不互通）。<br>'
    + '如需跨设备使用，请定期「导出备份」后在另一设备「导入」。<br>'
    + '<span style="color:#A08C7A;">当前已存储 ' + dayCount + ' 天记录</span><br>'
    + '<span style="color:#D4A0A0;font-size:10px;">⚠ 注意：Safari 和主屏幕 App 的存储是分开的。<br>如果从主屏幕打开看不到数据，请在 Safari 中打开网页导出备份，再到主屏幕 App 中导入。</span>'
    + '<br><span style="color:#A08C7A;">仅供家长参考 · 最终决定权在家长</span>';
  container.appendChild(info);

  footer.appendChild(container);
}

// ═══════════════════════════════════════════════════════════
// 主渲染
// ═══════════════════════════════════════════════════════════
function render(){
  const app=$('#app');
  if(!$('#header')){
    app.innerHTML='';
    app.appendChild(h('header',{id:'header',style:'text-align:center;padding:20px 12px 4px;background:linear-gradient(180deg,#FFF8F0,#FFFBF5)'},
      h('div',{style:'display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#A08C7A;letter-spacing:1px'},h('span',{},'🌻'),h('span',{},'Annie 成长合伙人'))
    ));
    app.appendChild(h('nav',{id:'nav',class:'nav'}));
    app.appendChild(h('main',{id:'main'}));
    app.appendChild(h('footer',{id:'appFooter',class:'footer'}));
    renderFooter();
  }
  renderNav();
  switch(view){
    case'daily':renderDaily();break;
    case'garden':renderGarden();break;
    case'achievements':renderAchievements();break;
    case'report':renderReport();break;
    case'health':renderHealth();break;
  }
}

// ── 初始化语音 ──
const hasSpeech = initSpeech();

// ── PWA: Service Worker（离线缓存 + 自动更新）──
// 策略：HTML 页面优先从网络获取（保证每次打开都是最新版）
//       静态资源优先从缓存获取（离线可用）
if ('serviceWorker' in navigator) {
  const swCode = `
const CACHE = 'annie-growth-v3';
const VERSION = '2026-05-17';

self.addEventListener('install', e => {
  self.skipWaiting();
});

self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys => Promise.all(
    keys.filter(k => k !== CACHE).map(k => caches.delete(k))
  )));
  self.clients.claim();
});

self.addEventListener('fetch', e => {
  if (e.request.method !== 'GET') return;
  // HTML 页面：网络优先，保证更新
  if (e.request.mode === 'navigate') {
    e.respondWith(
      fetch(e.request).then(resp => {
        if (resp.ok && resp.type === 'basic') {
          const clone = resp.clone();
          caches.open(CACHE).then(c => c.put(e.request, clone));
        }
        return resp;
      }).catch(() => caches.match(e.request))
    );
    return;
  }
  // 其他资源：缓存优先
  e.respondWith(
    caches.match(e.request).then(cached =>
      cached || fetch(e.request).then(resp => {
        if (resp.ok) {
          const clone = resp.clone();
          caches.open(CACHE).then(c => c.put(e.request, clone));
        }
        return resp;
      }).catch(() => cached || new Response('Offline'))
    )
  );
});
`;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}

// ── 启动 ──
render();
</script>
